[project]
name = "trsm-demo"
version = "0.1.0"
description = "Yerel TRSM analiz demosu"
requires-python = ">=3.11,<3.13"
dependencies = [
    "flask>=3.0",
    "numpy>=1.26",
    "ollama>=0.3",
    "pandas>=2.0",
    "psycopg[binary]>=3.2",
    "rapidfuzz>=3.5",
    "scikit-learn>=1.3",
    "sentence-transformers>=2.2",
    "torch==2.6.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.0",
    "matplotlib>=3.7",
    "nbformat>=5.9",
    "openpyxl>=3.1",
    "pytest>=7.4",
    "seaborn>=0.12",
    "streamlit>=1.28",
]

# Windows always obtains the CPU-only PyTorch wheel. macOS uses PyPI's native
# wheel via the absence of a matching source marker.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
